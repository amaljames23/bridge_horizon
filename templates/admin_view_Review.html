
{%include 'admin_header.html'%}

<style>
    .card {
            margin-bottom: 20px;
        }
</style>


<div class="container mt-5">
    <h2 class="text-center mb-4">Film Reviews</h2>
    <div class="row">
        {% for i in revv %}
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ i.film.film_name }}</h5>
                    <p class="card-text"><strong>Review:</strong> {{ i.review_text }}</p>
                    <p class="card-text"><strong>Rating:</strong> {{ i.rating }} / 5</p>
                    <p class="card-text"><small class="text-muted">Reviewed on {{ i.review_date }}</small></p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>



{%include 'footer.html'%}
