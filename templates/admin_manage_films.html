{%include 'admin_header.html'%} <br /><br /><br /><br /><br /><br />
<style>
  .form-container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  }
  .card img {
    height: 250px;
    object-fit: cover;
  }
</style>

{% if fimupd %}

<div class="container mt-5">
  <div class="form-container">
    <h2 class="text-center mb-4">Update Film Details</h2>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Film Name</label>
        <input
          type="text"
          name="film"
          class="form-control"
          value="{{ fimupd.film_name }}"
          required
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Details</label>
        <input
          type="text"
          name="deat"
          class="form-control"
          value="{{ fimupd.deatils }}"
          required
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Image</label>
        <input type="file" name="photo" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Release Date</label>
        <input
          type="text"
          name="redate"
          class="form-control"
          value="{{ fimupd.date }}"
          required
        />
      </div>

      <!-- <div class="mb-3">
        <label class="form-label">Film makers</label>
        <select name="film_maker_id" id="">
          {% for i in f_m %}
          <option value="{{ i.filmmaker_id }}">{{ i.name }}</option>
          {% endfor %}
        </select>
      </div> -->

      <div class="text-center">
        <button type="submit" class="btn btn-primary">Update Film</button>
      </div>
    </form>
  </div>
</div>

{%else%}

<div class="container mt-5">
  <div class="form-container">
    <h2 class="text-center mb-4">Add New Film</h2>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Film Name</label>
        <input type="text" name="film" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Details</label>
        <input type="text" name="deat" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Image</label>
        <input type="file" name="photo" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Film makers</label>
        <select name="film_maker_id" id="" class="form-control">
          {% for i in f_m %}
          <option value="{{ i.filmmaker_id }}">{{ i.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Release Date</label>
        <input type="date" name="redate" class="form-control" required />
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary">Add Film</button>
      </div>
    </form>
  </div>
</div>

<br /><br /><br /><br />
<div class="container mt-5">
  <h2 class="text-center mb-4">Films List</h2>
  <div class="row">
    {% for i in films %}
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm">
        <img
          src="/static/image/{{ i.photo }}"
          class="card-img-top"
          alt="Film Image"
        />
        <div class="card-body">
          <h5 class="card-title">{{ i.film_name }}</h5>
          <p class="card-text">{{ i.deatils }}</p>
          <p class="card-text"><strong>Release Date:</strong> {{ i.date }}</p>
          <div class="d-flex justify-content-between">
            <a href="/admin_update_films/{{ i.filmid }}" class="btn btn-primary"
              >Update</a
            >
            <a href="/admin_delete_films/{{ i.filmid }}" class="btn btn-danger"
              >Delete</a
            >
            <a href="/admin_review_films/{{ i.filmid }}" class="btn btn-danger"
              >View reviews</a
            >
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{%endif%} {%include 'footer.html'%}
