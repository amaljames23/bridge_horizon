
{%include 'admin_header.html'%}

<style>
    body {
        background-color: #f8f9fa;
    }
    .card-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }
    .card {
        width: 18rem;
    }
</style>

<br><br><br><br>


    
<div class="container">
    <h2 class="text-center my-4">Profiles</h2>
    <div class="card-container">
        {% for i in pro %}
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ i.name }}</h5>
                <p class="card-text"><strong>Email:</strong> {{ i.email }}</p>
                <p class="card-text"><strong>Phone:</strong> {{ i.phone }}</p>
                <p class="card-text"><strong>Place:</strong> {{ i.bio }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>

{%include 'footer.html'%}
