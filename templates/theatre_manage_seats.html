

{%include 'thearte_header.html'%}

<style>
    body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
</style>

    

<div class="container">
    <h2>Register Theater Owner</h2>
    <form action="" method="post" enctype="multipart/form-data" class="mb-4">
        <div class="mb-3">
            <label for="snum" class="form-label">Seat Number:</label>
            <input type="text" class="form-control" id="snum" name="snum" required>
        </div>
        <div class="mb-3">
            <label for="stype" class="form-label">Seat Type:</label>
            <input type="text" class="form-control" id="stype" name="stype" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Add Seat</button>
    </form>
</div>

<br><br><br><br>

<div class="container">
    <div class="row">
        {% for seat in st %}
        <div class="col-md-4 mb-3">
            <div class="card border-primary">
                <div class="card-body">
                    <h5 class="card-title">Seat No: {{ seat.seat_number }}</h5>
                    <p class="card-text"><strong>Type:</strong> {{ seat.seat_type }}</p>
                    <p class="card-text"><strong>SL.NO:</strong> {{ forloop.counter }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

    

{%include 'footer.html'%}
