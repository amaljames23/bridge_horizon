<!-- Link to Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<!-- Custom CSS for the payment page -->
<style>
    /* Style for the payment form */
    .payment-form {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        background-color: #f9f9f9;
    }

    .payment-form table {
        width: 100%;
    }

    .payment-form th, .payment-form td {
        padding: 10px;
    }

    .payment-form input[type="text"] {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .payment-form input[type="submit"] {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .payment-form input[type="submit"]:hover {
        background-color: #218838;
    }

    .payment-form .icon {
        margin-right: 10px;
    }
</style>


<div class="payment-form">
    <form action="" method="post">
        <table>
            <tr>
                <th><i class="fas fa-credit-card icon"></i>Card Number</th>
                <td><input type="text" name="card_number" id="card_number"></td>
            </tr>
            <tr>
                <th><i class="fas fa-lock icon"></i>Card CVV</th>
                <td><input type="text" name="card_cvv" id="card_cvv"></td>
            </tr>
            <tr>
                <th><i class="fas fa-calendar-alt icon"></i>Expiration Date</th>
                <td><input type="text" name="expiration_date" id="expiration_date"></td>
            </tr>
            <tr>
                <th colspan="2"><input type="submit" name="Pay" value="Pay Now"></th>
            </tr>
        </table>
    </form>
</div>
