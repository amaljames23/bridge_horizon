{% include 'content_manager_header.html' %}
<br><br><br><br><br>
<center>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-body {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
        }
    </style>

<div class="container mt-5">
    <h1 class="text-center mb-4 text-primary">Profile view</h1>
    <div class="row justify-content-center">
        {% for i in maker %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-lg text-center">
                <div class="card-body">
                    <img src="static/image/{{ i.profile_image }}" alt="Profile Image" class="profile-img rounded-circle mb-3">
                    <h4 class="card-title text-dark">{{ i.name }}</h4>
                    <p class="card-text text-muted"><strong>Email:</strong> {{ i.email }}</p>
                    <p class="card-text text-muted"><strong>Phone:</strong> {{ i.phone }}</p>
                    <p class="card-text text-secondary">{{ i.bio }}</p>
                    <!-- <a href="/film_update_profile/{{ i.filmmaker_id }}" class="btn btn-outline-primary">Update Profile</a> -->
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center">
            <p class="text-danger">No filmmakers found.</p>
        </div>
        {% endfor %}
    </div>
</div>


<br><br><br><br>
</center>

{% include 'footer.html' %}
