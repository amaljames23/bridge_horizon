<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint Management</title>
    <style>
      /* Card styling */
      .card-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
        justify-content: center;
      }

      .complaint-card {
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        width: 300px;
        transition: transform 0.3s ease;
      }

      .complaint-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
        margin-bottom: 15px;
      }

      .complaint-number {
        font-weight: bold;
        color: #555;
      }

      .complaint-date {
        color: #777;
        font-size: 0.9em;
      }

      .complaint-content {
        margin-bottom: 15px;
      }

      .complaint-text {
        font-weight: bold;
        margin-bottom: 10px;
      }

      .reply-text {
        color: #555;
        font-style: italic;
        margin-bottom: 15px;
        padding-left: 10px;
        border-left: 3px solid #ddd;
      }

      .action-button {
        display: inline-block;
        background-color: #4285f4;
        color: white;
        padding: 8px 16px;
        border-radius: 4px;
        text-decoration: none;
        text-align: center;
        transition: background-color 0.3s ease;
      }

      .action-button:hover {
        background-color: #3367d6;
      }

      .page-title {
        text-align: center;
        margin: 20px 0;
        color: #333;
      }

      .no-reply {
        color: #f44336;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    {% include 'admin_header.html' %}

    <br /><br /><br /><br /><br /><br /><br />

    <h2 class="page-title" style="color: white">Complaint Management</h2>

    <div class="card-container">
      {% for i in comp %}
      <div class="complaint-card">
        <div class="card-header">
          <span class="complaint-number">#{{ forloop.counter }}</span>
          <span class="complaint-date" style="color: black;">{{ i.date }}</span>
        </div>
        <div class="complaint-content">
          <div class="complaint-text" style="color: black;">{{ i.complaint }}</div>
          <div class="complaint-user" style="color: black;">
            <strong>From:</strong> {{ i.senderid.username }}
          </div>
          <div class="reply-text" style="color: black;">
            {% if i.reply %} {{ i.reply }} {% else %}
            <span class="no-reply">No reply yet</span>
            {% endif %}
          </div>
        </div>
        <a href="/admin_send_reply/{{ i.complaintid }}" class="action-button"
          >Send Reply</a
        >
      </div>
      {% endfor %}
    </div>

    {% include 'footer.html' %}
  </body>
</html>
