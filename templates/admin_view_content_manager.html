
{%include 'admin_header.html'%}
<style>
    body {
        background-color: #f8f9fa;
    }
    .card-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }
    .card {
        width: 18rem;
    }
</style>


<div class="container">
    <h2 class="text-center my-4">Content Managers</h2>
    <div class="card-container">
        {% for i in cm %}
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ i.name }}</h5>
                <p class="card-text"><strong>Email:</strong> {{ i.email }}</p>
                <p class="card-text"><strong>Phone:</strong> {{ i.phone }}</p>
                <div class="d-flex justify-content-between">
                    <a href="/accept_content_manager/{{ i.login_id }}" class="btn btn-success">Accept</a>
                    <a href="/reject_content_manager/{{ i.login_id }}" class="btn btn-danger">Reject</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{%include 'footer.html'%}
