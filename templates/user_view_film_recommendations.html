{% include 'user_header.html' %}
<br><br><br><br>


<!-- <h2>Film Recommendations (Ranked by Bookings)</h2> -->
<div class="container">
    <h2 class="text-center my-4">Top Ranked Films</h2>
    <div class="row">
        {% for film in films_ranked %}
        <div class="col-md-4 mb-4">
            <div class="card shadow">
                <img src="static/image/{{ film.photo }}" class="card-img-top" alt="{{ film.film_name }}" style="height: 250px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">{{ film.film_name }}</h5>
                    <p class="text-muted"><strong>Rank #{{ forloop.counter }}</strong></p>
                    <p class="card-text"><strong>Filmmaker:</strong> {{ film.filmmaker.name }}</p>
                    <p class="card-text"><strong>Details:</strong> {{ film.deatils }}</p>
                    <!-- <p class="card-text"><strong>Release Date:</strong> {{ film.date }}</p>
                    <p class="card-text"><strong>Bookings:</strong> {{ film.booking_count }}</p>
                    <a href="/user_view_theaters" class="btn btn-primary">View Theaters</a> -->
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
