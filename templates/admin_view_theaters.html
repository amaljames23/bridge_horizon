{%include 'admin_header.html'%}

<style>
    body {
        background-color: #a5a5c8d2;
    }
    .card-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }
    .card {
        width: 20rem;
    }
    .card img {
        height: 250px;
        object-fit: cover;
    }
</style>

<br><br><br><br><br>

<div class="container">
    <h2 class="text-center my-4" style="color: black;">Theater Owners</h2>
    <div class="card-container">
        {% for i in th %}
        <div class="card shadow-sm">
            <img src="/static/image/{{ i.license_photo }}" class="card-img-top" alt="License Image">
            <div class="card-body">
                <h5 class="card-title" style="color: black;">{{ i.name }}</h5>  
                <p class="card-text" style="color: black;"><strong>Email:</strong> {{ i.email }}</p>
                <p class="card-text" style="color: black;"><strong>Phone:</strong> {{ i.phone }}</p>
                <div class="d-flex justify-content-between">
                    <a href="/accept_theaterowner/{{ i.login_id }}" class="btn btn-success">Accept</a>
                    <a href="/reject_theaterowner/{{ i.login_id }}" class="btn btn-danger">Reject</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>


{%include 'footer.html'%}
